[project]
name = "brindes-automa-backend"
version = "0.1.0"
description = "Backend Django do brindes-automa-tiny: espelho de catálogo dos fornecedores e sincronização com contas do Tiny"
requires-python = ">=3.12"
dependencies = [
    "django (>=5.0,<5.1)",
    "djangorestframework (>=3.15,<4.0)",
    "psycopg[binary] (>=3.1,<4.0)",
    "cryptography (>=42.0,<43.0)",
    "requests (>=2.32,<3.0)",
    "pillow (>=11.0,<12.0)",
    "celery (>=5.4,<6.0)",
    "redis (>=5.0,<6.0)",
    "django-cors-headers (>=4.4,<5.0)",
    "drf-spectacular (>=0.27,<0.28)",
    "gunicorn (>=23.0,<24.0)",
    "whitenoise (>=6.7,<7.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
