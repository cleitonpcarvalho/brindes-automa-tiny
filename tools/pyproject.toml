[project]
name = "brindes-automa-tools"
version = "0.1.0"
description = "Ferramentas descartáveis para coleta e análise de amostras das APIs de fornecedores (passo zero, fora da aplicação)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.32,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
